<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1B33"><meta name="robots" content="noindex">
<title>AI Global Initiative: Exercise 001</title>
<!-- The portal: one address for the day. Participants go to /play, the game master to /gm. -->
<style>
@font-face { font-family: "Schibsted Grotesk"; font-weight: 400 900; src: url("fonts/schibsted-grotesk-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "ArchivoV"; font-weight: 100 900; font-stretch: 62% 125%; src: url("fonts/archivo-latin-wdth-normal.woff2") format("woff2"); }
:root { --navy: #0B1B33; --navy-hi: #14294B; --deep: #061022; --blue: #7298E9; --blue-lo: #4F78D6; --ice: #CFE0FF; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; } body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px; color: #fff; font-family: "Schibsted Grotesk", system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: var(--deep); overflow: hidden; }
.bg { position: fixed; inset: 0; background: radial-gradient(120% 90% at 30% 40%, var(--navy-hi) 0%, var(--navy) 45%, var(--deep) 100%); }
.bg img { position: absolute; left: 50%; top: 50%; width: max(150vw, 190vh); transform: translate(-46%, -47%); opacity: .2; }
.bg i { position: absolute; left: 0; right: 0; top: 21%; height: 1px; background: linear-gradient(90deg, transparent, var(--blue) 30%, var(--ice) 50%, var(--blue) 70%, transparent); opacity: .35; }
main { position: relative; width: min(520px, 100%); }
.lock { display: flex; align-items: stretch; gap: .32em; font-size: clamp(26px, 7.4vw, 50px); margin-bottom: .9em; }
.lock .bar { width: .13em; background: linear-gradient(180deg, #E4EDFF, var(--blue)); }
.lock .w { font-family: "ArchivoV"; font-weight: 900; font-stretch: 108%; letter-spacing: -.035em; line-height: .95; padding: .06em 0; white-space: nowrap; }
.lock .w span { display: block; background: linear-gradient(180deg, #E4EDFF 0%, #A9C2F7 38%, #7298E9 62%, #4F78D6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
a { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; margin-top: 12px; color: #fff; text-decoration: none; font-weight: 800; font-size: 20px; }
a::after { content: "→"; font-weight: 600; opacity: .7; }
a.play { color: var(--navy); background: linear-gradient(180deg, #9DB8F2, var(--blue) 55%, var(--blue-lo)); }
a.gm { background: linear-gradient(180deg, rgba(20,41,75,.94), rgba(11,27,51,.97)); border-top: 3px solid rgba(114,152,233,.4); }
</style></head>
<body>
<div class="bg"><img src="map.png" alt=""><i></i></div>
<main>
  <div class="lock"><div class="bar"></div><div class="w">AI Global Initiative<span>Exercise 001</span></div></div>
  <a class="play" href="play">Participant</a>
  <a class="gm" href="gm">Game master</a>
</main>
</body></html>
